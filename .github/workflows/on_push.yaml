name: on-push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_docker:
    name: Build Docker
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yaml
    with:
      fetch-depth: 0
    secrets: inherit

  publish_main:
    name: Publish main image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build Linux binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          GOARCH=amd64 go build -trimpath -o linux/amd64/traefik-kop ./bin/traefik-kop
          GOARCH=arm64 go build -trimpath -o linux/arm64/traefik-kop ./bin/traefik-kop
          GOARCH=arm GOARM=6 go build -trimpath -o linux/arm/v6/traefik-kop ./bin/traefik-kop
          GOARCH=arm GOARM=7 go build -trimpath -o linux/arm/v7/traefik-kop ./bin/traefik-kop
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image to GHCR
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --push --platform linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:main" --tag "${image}:sha-${GITHUB_SHA::12}" .
